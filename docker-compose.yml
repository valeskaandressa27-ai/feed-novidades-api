services:
  postgres:
    image: postgres:16-alpine
    container_name: feed-novidades-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feed_novidades}
      POSTGRES_USER: ${POSTGRES_USER:-feed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
